[tools]
chezmoi = "latest"
cloudflare-cf = "latest"
fnox = "latest"
fzf = "latest"
gcc-arm-none-eabi = "latest"
gh = "latest"
lazygit = "latest"
neovim = "latest"
node = "lts"
rust = "stable"
task = "latest"
uv = "latest"

[settings]
minimum_release_age = "1d"
cache_prune_age = "1d"

[settings.self_update]
auto = true

[settings.tool_update]
global_auto = true

[settings.upgrade]
prune_after = "10m"
